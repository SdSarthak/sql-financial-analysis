name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Smoke test the pipeline end to end
        run: |
          python -m sqlfin sample --rows 500 --out data/sample_clients.csv
          python -m sqlfin init-db
          python -m sqlfin load data/sample_clients.csv
          python -m sqlfin run book_overview
          python -m sqlfin report --out reports
